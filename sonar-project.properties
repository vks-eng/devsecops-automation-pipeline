# SonarQube analysis configuration for ShieldOps itself.
# Run locally:  sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN
# (the token is passed at runtime, never committed)
sonar.projectKey=vks-eng_devsecops-automation-pipeline
sonar.projectName=ShieldOps DevSecOps Automation Platform
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,backend/app/adapters/mock_data/**,**/*.json
sonar.coverage.exclusions=backend/app/seed.py,backend/scripts/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/junit.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.qualitygate.wait=true
