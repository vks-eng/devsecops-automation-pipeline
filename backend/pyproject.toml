[project]
name = "shieldops-api"
version = "1.0.0"
description = "ShieldOps: DevSecOps Automation Platform - API and background workers"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "email-validator>=2.1",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.9",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "packaging>=24.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
    # Embedded PostgreSQL binaries used ONLY by the local test-suite when
    # TEST_DATABASE_URL is not set. Never used by the application itself.
    "pgserver>=0.1.4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["adapters/mock_data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S311", "S603"]
"scripts/**" = ["T201"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests (no database, no network)",
    "integration: API + PostgreSQL and adapter integration tests",
    "e2e: end-to-end user journeys through the API",
    "contract: API / scanner-output contract tests",
    "security: security-focused tests (authz, HMAC, injection, secrets)",
    "smoke: fast critical-path subset (run with -m smoke)",
    "slow: long-running tests (volume)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "alembic"]
